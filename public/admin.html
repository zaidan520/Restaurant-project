<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Haqania Foods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .date-filter {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .date-filter input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 8px;
    }
    .filter-buttons {
      display: flex;
      gap: 0.5rem;
    }
    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }
    .order-items-list {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }
    .order-item-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 0.25rem 0;
    }
    .order-total {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
      text-align: right;
      font-weight: bold;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-logo"><span>Haqania</span> <em>Foods</em></a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="order.html" class="btn-nav">Order Now</a></li>
      <li><a href="admin.html" class="active">Admin</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="page-header">
    <h1>Order <span>Management</span></h1>
    <p>Kitchen Control Center</p>
  </div>

  <div class="admin-container">
    <div class="admin-topbar">
      <div>
        <h2><span>Live</span> Orders</h2>
        <p style="color:var(--text-muted);font-size:0.85rem;margin-top:0.25rem">Auto-refreshes every 10 seconds</p>
      </div>
      <div class="date-filter">
        <input type="date" id="dateFilter" />
        <div class="filter-buttons">
          <button class="filter-btn" data-days="0">Today</button>
          <button class="filter-btn" data-days="1">Yesterday</button>
          <button class="filter-btn" data-days="7">Last 7 Days</button>
          <button class="filter-btn active" data-days="all">All Orders</button>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem">
      <span style="background:rgba(245,166,35,0.15);color:#f5a623;font-size:0.72rem;font-weight:700;padding:0.3rem 0.75rem;border-radius:50px">Pending: <span id="countPending">0</span></span>
      <span style="background:rgba(34,197,94,0.15);color:#22c55e;font-size:0.72rem;font-weight:700;padding:0.3rem 0.75rem;border-radius:50px">Accepted: <span id="countAccepted">0</span></span>
      <span style="background:rgba(59,130,246,0.15);color:#3b82f6;font-size:0.72rem;font-weight:700;padding:0.3rem 0.75rem;border-radius:50px">Completed: <span id="countCompleted">0</span></span>
      <div class="updated-badge">Last updated: <span id="lastUpdated">--:--:--</span></div>
    </div>

    <div id="ordersContainer">
      <div class="spinner"></div>
    </div>
  </div>

  <footer style="margin-top:2rem">
    <div class="footer-bottom">&copy; 2025 Haqania Foods. All rights reserved.</div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
